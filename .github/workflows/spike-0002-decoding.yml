# Spike 2 (decision record 0002): run the decoding bench on Windows and Linux x64.
# Manual only. One job makes the synthetic clips (or reuses them from an earlier run); each platform then decodes
# the same files with the packages Anki 26.9.2's launcher installs there (aqt[qt,audio] from PyPI). Each engine and
# clip set is its own step, so one crash or kill does not hide the rest. Results come back as artifacts.
name: spike-0002-decoding

on:
  workflow_dispatch:
    inputs:
      clips_run:
        description: "Reuse the clips from this run ID (blank: make new ones)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

env:
  ANKI_PINS: "aqt[qt,audio]==26.9.2"
  RADSCROLL_ANKI_PACKAGES: ""  # Anki's packages are installed in the runner's Python, not borrowed from an app
  PYTHONUNBUFFERED: "1"
  LONG: "--cycle 265 --frames 10800"

jobs:
  clips:
    if: inputs.clips_run == ''
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: FFmpeg 8.1 (static build with x264, x265, libvpx, SVT-AV1)
        run: |
          curl -sSL -o ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz
          mkdir ff && tar -xJf ff.tar.xz -C ff --strip-components=1
          echo "$PWD/ff/bin" >> "$GITHUB_PATH"
      - run: pip install "$ANKI_PINS" && ffmpeg -version | head -1
      - name: Make clips
        run: python -I spikes/0002-decoding/make_clips.py clips
      - uses: actions/upload-artifact@v7
        with:
          name: clips
          path: |
            clips/*.*
            clips/long/
          retention-days: 7

  bench:
    needs: clips
    if: ${{ !cancelled() && (needs.clips.result == 'success' || needs.clips.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            name: windows-x64
          - os: ubuntu-24.04
            name: linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      B: spikes/0002-decoding/ci_bench.sh ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        with:
          name: clips
          path: clips
          run-id: ${{ inputs.clips_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Linux system libraries, and the distribution's mpv (Anki ships none on Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libpulse0 mpv time
          echo "QT_QPA_PLATFORM=offscreen" >> "$GITHUB_ENV"
      - run: pip install "$ANKI_PINS" && pip list
      - name: Probe
        run: mkdir -p out && python -I spikes/0002-decoding/probe.py | tee out/${{ matrix.name }}-probe.json

      - { name: mpv short, continue-on-error: true, timeout-minutes: 10, run: "$B clips mpv" }
      - { name: mpv long H.264, continue-on-error: true, timeout-minutes: 15, run: "$B clips/long mpv $LONG h264_3min_2560.mp4" }
      - { name: mpv long HEVC, continue-on-error: true, timeout-minutes: 15, run: "$B clips/long mpv $LONG hevc_3min_2560.mp4" }
      - { name: qt16 short, continue-on-error: true, timeout-minutes: 10, run: "$B clips qt16" }
      - { name: qt16 long H.264, continue-on-error: true, timeout-minutes: 15, run: "$B clips/long qt16 $LONG h264_3min_2560.mp4" }
      - { name: qt16 long HEVC, continue-on-error: true, timeout-minutes: 15, run: "$B clips/long qt16 $LONG hevc_3min_2560.mp4" }
      - { name: qt16d short, continue-on-error: true, timeout-minutes: 10, run: "$B clips qt16d" }
      - { name: qt16d long H.264, continue-on-error: true, timeout-minutes: 15, run: "$B clips/long qt16d $LONG h264_3min_2560.mp4" }
      - { name: qt16d long HEVC, continue-on-error: true, timeout-minutes: 15, run: "$B clips/long qt16d $LONG hevc_3min_2560.mp4" }

      - name: Kernel memory kills (Linux)
        if: always() && runner.os == 'Linux'
        run: sudo dmesg | grep -iE 'oom|killed process' | tail -20 | tee out/${{ matrix.name }}-oom.log || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-${{ matrix.name }}
          path: out/
          retention-days: 14
