# Spike 2 (decision record 0002): run the decoding bench on Windows and Linux x64.
# Manual only. One job makes the synthetic clips; each platform then decodes the same files with the packages
# Anki 26.9.2's launcher installs there (aqt[qt,audio] from PyPI). Results come back as artifacts.
name: spike-0002-decoding

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANKI_PINS: "aqt[qt,audio]==26.9.2"
  RADSCROLL_ANKI_PACKAGES: ""  # Anki's packages are installed in the runner's Python, not borrowed from an app
  PYTHONUNBUFFERED: "1"

jobs:
  clips:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: FFmpeg 8.1 (static build with x264, x265, libvpx, SVT-AV1)
        run: |
          curl -sSL -o ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz
          mkdir ff && tar -xJf ff.tar.xz -C ff --strip-components=1
          echo "$PWD/ff/bin" >> "$GITHUB_PATH"
      - run: pip install "$ANKI_PINS" && ffmpeg -version | head -1
      - name: Make clips
        run: python -I spikes/0002-decoding/make_clips.py clips
      - uses: actions/upload-artifact@v4
        with:
          name: clips
          path: |
            clips/*.*
            clips/long/
          retention-days: 3

  bench:
    needs: clips
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            name: windows-x64
          - os: ubuntu-24.04
            name: linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: clips
          path: clips
      - name: Linux system libraries, and the distribution's mpv (Anki ships none on Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libpulse0 mpv
          echo "QT_QPA_PLATFORM=offscreen" >> "$GITHUB_ENV"
      - run: pip install "$ANKI_PINS" && pip list
      - name: Probe
        run: |
          mkdir -p out
          python -I spikes/0002-decoding/probe.py | tee out/${{ matrix.name }}-probe.json
      - name: Bench
        run: |
          B=spikes/0002-decoding/bench.py
          LONG="--cycle 265 --frames 10800 h264_3min_2560.mp4 hevc_3min_2560.mp4"
          R=out/${{ matrix.name }}.jsonl
          for e in mpv qt16; do
            python -I $B clips $e >> $R 2>> out/${{ matrix.name }}-$e.log || true
            python -I $B clips/long $e $LONG >> $R 2>> out/${{ matrix.name }}-$e.log || true
          done
          cat $R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.name }}
          path: out/
          retention-days: 14
